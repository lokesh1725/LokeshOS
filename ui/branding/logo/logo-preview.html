<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LokeshOS — Titanium Logo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #050608;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .logo-container {
            width: min(70vw, 900px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo {
            display: block;
            width: 100%;
            height: auto;
            object-fit: contain;
        }
    </style>
</head>

<body>

    <main class="logo-container">
        <img
            class="logo"
            src="./lokeshos-titanium.png"
            alt="LokeshOS Titanium Logo"
        >
    </main>

</body>
</html>
